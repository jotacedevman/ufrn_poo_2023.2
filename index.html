<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/tabStyles.css" />
    <script src="./js/aluno.js" defer></script>
    <script src="./js/interface.js" defer></script>
    <script src="./js/main.js" defer></script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button class="tab-button active" id="btn-cadastrar" onclick="Interface.cadastrar()">Cadastrar</button>
      <button class="tab-button" id="btn-listar" onclick="listarAluno()">Listar Alunos</button>
    </div>

    <!-- Conteúdo da Aba 1: Cadastrar -->
    <div id="tab-cadastrar" class="tab-content active">
      Nome: <input id="nome" type="text" />
      Nota 1: <input id="n1" type="text" />
      Nota 2: <input id="n2" type="text" />
      Nota 3: <input id="n3" type="text" />
      <button onclick="btnSalvar()" class="btn-salvar">Salvar Aluno</button>
    </div>

    <!-- Conteúdo da Aba 2: Listar -->
    <div id="tab-listar" class="tab-content">
      <h3>Alunos Cadastrados</h3>
      <ul class="lista-alunos" id="alunos">
        <!-- O JavaScript vai colocar os alunos aqui depois -->
        <li>Nenhum aluno cadastrado ainda.</li>
      </ul>
    </div>

    <!-- Mostrador de mensagens -->
    <div id="main-logs" class="main">
      <div id="display">Sistema pronto!</div>
    </div>
  </body>
</html>
